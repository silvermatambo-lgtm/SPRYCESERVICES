const contact=()=>`${pageHero('GET IN TOUCH','Contact SPRYCE SERVICES','Speak with us about refrigeration, air conditioning, appliance repairs, cold rooms or pest control.')}<section class="section alt"><div class="wrap contact-grid"><div class="panel reveal"><div class="tag">REQUEST A QUOTATION</div><h2>Send an enquiry</h2><p class="muted">Complete the details below and continue to WhatsApp to review and send the message.</p><form id="contactForm"><div class="field-grid"><div class="field"><label for="contactName">Full name *</label><input id="contactName" name="name" required minlength="2" placeholder="Full name"></div><div class="field"><label for="contactPhone">Phone number *</label><input id="contactPhone" name="phone" required placeholder="Contact number" type="tel"></div></div><div class="field"><label for="contactEmail">Email address *</label><input id="contactEmail" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="contactService">Service *</label><select name="service" id="contactService" required><option value="">Choose a service</option>${S.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}<option>Other</option></select></div><div class="field"><label for="contactMessage">Tell us about the job *</label><textarea name="message" id="contactMessage" required minlength="5" placeholder="Equipment, model, issue, location and anything else we should know"></textarea></div><button type="submit" class="btn btn-blue" style="width:100%">Continue to WhatsApp →</button><p class="muted" role="status" id="contactStatus">Nothing is sent automatically; please press Send in WhatsApp.</p></form></div><div class="reveal"><div class="panel"><div class="tag">CONTACT DETAILS</div><h2>We'd love to hear from you.</h2><div class="contact-method"><div class="icon">☎</div><div><b>Call SPRYCE SERVICES</b><a href="tel:${phonenumber}" style="color:#077fb8">${phone}</a></div></div><div class="contact-method"><div class="icon">✉</div><div><b>Business email</b><a href="mailto:info@spryceservices.co.za" style="color:#077fb8">info@spryceservices.co.za</a></div></div><div class="contact-method"><div class="icon">💬</div><div><b>WhatsApp</b><a href="${wa()}" target="_blank" rel="noreferrer" style="color:#077fb8">Start WhatsApp chat</a></div></div><div class="contact-method"><div class="icon">◎</div><div><b>Service locations & site visits</b><span>Contact us to confirm availability and arrange a visit.</span></div></div></div><div class="panel dark" style="margin-top:22px"><div class="tag">EXTRA DETAIL HELPS</div><h2 style="font-size:28px;margin-top:14px">What should I include?</h2><p style="color:#ccdae9;line-height:1.75">For fridges and air conditioners, send the make, model and symptoms. For cold rooms, tell us the purpose, desired size and temperature. For pest control, describe the problem and location.</p></div></div></div></section>`;

let slide=0,sliderTimer=null,writerTimer=null,paused=false,step=0,answers={name:'',phone:'',service:'',message:''};
function render(){const path=location.protocol==='file:'?(location.hash.slice(1).split('?')[0]||'/'):decodeURI(location.pathname.replace(/\/$/,'')||'/');const screen=screens[path]||home;document.title=(path==='/'?'SPRYCE SERVICES | Refrigeration & Cold Rooms':(paths.find(p=>p[0]===path)||['','SPRYCE SERVICES'])[1]+' | SPRYCE SERVICES');root.innerHTML=header(path)+`<main id="content">${screen()}</main>`+footer()+extras();bind(path);window.scrollTo({top:0,behavior:'instant'});}
function go(url){if(location.protocol==='file:'){location.hash='#'+url;render();return}history.pushState({},'',url);render();}
function bind(path){document.querySelectorAll('a.internal').forEach(a=>a.addEventListener('click',e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;e.preventDefault();go(a.getAttribute('href'));}));const menu=document.getElementById('menuToggle'),mob=document.getElementById('mobileNav');menu.addEventListener('click',()=>{let open=mob.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'×':'☰';});document.getElementById('toTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));document.getElementById('chatButton').addEventListener('click',toggleChat);document.getElementById('chatClose').addEventListener('click',toggleChat);document.getElementById('chatBack').addEventListener('click',()=>{captureChat();step=Math.max(0,step-1);drawChat();});document.getElementById('chatNext').addEventListener('click',advanceChat);const contact=document.getElementById('contactForm');if(contact){let qp=new URLSearchParams(location.search).get('service');if(qp&&S.some(x=>x.name===qp))contact.elements.service.value=qp;contact.addEventListener('submit',event=>{event.preventDefault();let f=new FormData(contact);let msg=`Hello SPRYCE SERVICES, please assist me.\n\nName: ${f.get('name')}\nPhone: ${f.get('phone')}\nEmail: ${f.get('email')}\nService: ${f.get('service')}\nDetails: ${f.get('message')}`;window.open(wa(msg),'_blank','noopener,noreferrer');document.getElementById('contactStatus').textContent='WhatsApp has opened. Press Send there to complete your enquiry.';});}initReveal();if(path==='/')startSlider();else stopSlider();refreshScroll();}
function stopSlider(){clearInterval(sliderTimer);clearInterval(writerTimer)}function startSlider(){stopSlider();slide=0;showSlide(0);sliderTimer=setInterval(()=>{if(!paused)showSlide((slide+1)%cfg.heroSlides.length)},6800);document.getElementById('nextHero').addEventListener('click',()=>showSlide((slide+1)%cfg.heroSlides.length));document.getElementById('prevHero').addEventListener('click',()=>showSlide((slide+cfg.heroSlides.length-1)%cfg.heroSlides.length));document.getElementById('pauseHero').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ';e.target.setAttribute('aria-label',paused?'Resume slideshow':'Pause slideshow');});document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>showSlide(+b.dataset.slide)));}
function showSlide(index){slide=index;const s=cfg.heroSlides[index];const bg=document.getElementById('heroBg');if(!bg)return;bg.style.opacity='.25';setTimeout(()=>{if(!document.getElementById('heroBg'))return;bg.style.backgroundImage=`url('${s.image}')`;bg.style.opacity='1'},180);document.getElementById('heroTag').textContent=s.eyebrow;document.getElementById('heroTitle').textContent=s.heading;document.getElementById('heroDescription').textContent=s.description;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===index));const target=document.getElementById('heroTyped');target.textContent='';clearInterval(writerTimer);let n=0;if(matchMedia('(prefers-reduced-motion:reduce)').matches){target.textContent=s.highlight;return}writerTimer=setInterval(()=>{if(!target.isConnected){clearInterval(writerTimer);return}target.textContent=s.highlight.slice(0,++n);if(n>=s.highlight.length)clearInterval(writerTimer)},53);}
function initReveal(){let nodes=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){nodes.forEach(n=>n.classList.add('visible'));return}let observer=new IntersectionObserver(items=>items.forEach(i=>{if(i.isIntersecting){i.target.classList.add('visible');observer.unobserve(i.target)}}),{threshold:.09});nodes.forEach(n=>observer.observe(n));}
function toggleChat(){const panel=document.getElementById('chatPanel');let opened=!panel.classList.toggle('hide');document.getElementById('chatButton').setAttribute('aria-expanded',String(opened));if(opened)drawChat();}
function captureChat(){const inp=document.getElementById('chatInput');if(inp){let key=['','name','phone','service','message'][step];if(key)answers[key]=inp.value;}}
function drawChat(){const title=['Welcome to SPRYCE SERVICES','What is your name?','Your contact number','Which service do you need?','Tell us more about the job','Review your enquiry'][step];const body=document.getElementById('chatBody');let content=`<strong>${esc(title)}</strong>`;if(step===0)content+='<p class="muted">We can help with refrigeration, air-conditioning, appliance repair, cold rooms and pest control. Follow the prompts to prepare a WhatsApp message.</p>';if(step===1||step===2)content+=`<input id="chatInput" value="${esc(step===1?answers.name:answers.phone)}" placeholder="${step===1?'Full name':'Phone number'}" ${step===2?'type="tel"':''} aria-label="${esc(title)}">`;if(step===3)content+=`<select id="chatInput" aria-label="Choose service"><option value="">Choose a service</option>${S.map(s=>`<option value="${esc(s.name)}" ${answers.service===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;if(step===4)content+=`<textarea id="chatInput" rows="5" placeholder="Equipment details, issue or project location" aria-label="Describe the enquiry">${esc(answers.message)}</textarea>`;if(step===5)content+=`<p class="muted"><b>Name:</b> ${esc(answers.name)}<br><b>Phone:</b> ${esc(answers.phone)}<br><b>Service:</b> ${esc(answers.service)}<br><b>Details:</b> ${esc(answers.message)}</p><p class="muted">WhatsApp will open; nothing is sent automatically.</p>`;body.innerHTML=content;document.getElementById('chatBack').disabled=step===0;document.getElementById('chatNext').textContent=step===5?'Open WhatsApp ↗':'Continue →';}
function advanceChat(){captureChat();if(step===1&&answers.name.trim().length<2){alert('Please enter a name.');return}if(step===2&&answers.phone.replace(/\D/g,'').length<8){alert('Please enter a valid phone number.');return}if(step===3&&!answers.service){alert('Please choose a service.');return}if(step===4&&answers.message.trim().length<5){alert('Please give some details.');return}if(step===5){const msg=`Hello SPRYCE SERVICES, please assist me.\n\nName: ${answers.name}\nPhone: ${answers.phone}\nService: ${answers.service}\nDetails: ${answers.message}`;window.open(wa(msg),'_blank','noopener,noreferrer');toggleChat();return}step++;drawChat();}
function refreshScroll(){let h=document.getElementById('header');if(h)h.classList.toggle('solid',scrollY>24||location.pathname!=='/');let top=document.getElementById('toTop');if(top)top.classList.toggle('hide',scrollY<450);}
window.addEventListener('scroll',refreshScroll,{passive:true});window.addEventListener('popstate',render);
let installEvent=null;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;if(!sessionStorage.getItem('spryce-install-hide'))document.getElementById('installPrompt')?.classList.remove('hide')});window.addEventListener('click',e=>{if(e.target?.id==='installAccept'&&installEvent){installEvent.prompt();document.getElementById('installPrompt').classList.add('hide')}if(e.target?.id==='installDismiss'){sessionStorage.setItem('spryce-install-hide','yes');document.getElementById('installPrompt').classList.add('hide')}});
render();if(false&&'serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script></body></html>
